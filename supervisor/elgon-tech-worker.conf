# Supervisor Configuration for Elgon Tech Queue Workers
# Location: /etc/supervisor/conf.d/elgon-tech-worker.conf
# After creating/updating this file, run:
#   sudo supervisorctl reread
#   sudo supervisorctl update
#   sudo supervisorctl start all

[program:elgon-tech-queue-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/elgon-tech/artisan queue:work database --sleep=3 --tries=3 --timeout=60
autostart=true
autorestart=true
numprocs=4
redirect_stderr=true
stdout_logfile=/var/log/elgon-tech-queue.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=10
environment=LARAVEL_QUEUE=database
startsecs=0
process_priority=999
stopwaitsecs=10

# Optional: Schedule runner
[program:elgon-tech-scheduler]
process_name=%(program_name)s
command=php /var/www/elgon-tech/artisan schedule:work
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/var/log/elgon-tech-scheduler.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=10
stopwaitsecs=10

# Configuration Notes:
# - numprocs: Number of worker processes to spawn (adjust based on CPU cores)
# - sleep: Time to sleep when polling queue (increase to reduce CPU usage)
# - tries: Maximum number of times a job should be attempted
# - timeout: Maximum time in seconds a job is allowed to run
# - stopwaitsecs: Time to wait before killing worker process
